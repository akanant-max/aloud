[versions]
sdk-compile = "37"
sdk-min = "28"
sdk-target = "36"

agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
coroutines = "1.11.0"
room = "2.8.5"
media3 = "1.10.1"
androidx-lifecycle = "2.11.0"
jvm-bytecode = "17"
jvm-toolchain = "17"

[libraries]
compose-bom = "androidx.compose:compose-bom:2026.09.00"
# Pinned ahead of the BOM for the Material 3 Expressive theme, shapes and type styles.
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-rc01" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-core = "androidx.core:core-ktx:1.19.0"
activity-compose = "androidx.activity:activity-compose:1.12.0"
navigation-compose = "androidx.navigation:navigation-compose:2.9.6"
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }

room-runtime = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

documentfile = "androidx.documentfile:documentfile:1.1.0"
datastore-preferences = "androidx.datastore:datastore-preferences:1.3.0"
materialkolor = "com.materialkolor:material-kolor:5.0.1"
coil = "io.coil-kt:coil-compose:2.7.0"
pdfbox-android = "com.tom-roush:pdfbox-android:2.0.27.0"

junit = "junit:junit:4.13.2"
truth = "com.google.truth:truth:1.4.4"
robolectric = "org.robolectric:robolectric:4.16"
androidx-test-core = "androidx.test:core:1.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
