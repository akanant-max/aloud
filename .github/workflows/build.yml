name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        if: success() || failure()
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aloud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes the APK as a rolling release too, so it can be installed from a
      # phone in one tap instead of downloading and unzipping an Actions artifact.
      - name: Publish to the latest release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app/build/outputs/apk/debug/*.apk aloud.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aloud.apk \
            --title "Latest build" \
            --notes "Debug build of ${{ github.sha }}. Tap aloud.apk below to install." \
            --prerelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
