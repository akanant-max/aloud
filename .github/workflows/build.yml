name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: Unit tests
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: Upload APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aloud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes the APK as a rolling release too, so it can be installed from a
      # phone in one tap instead of downloading and unzipping an Actions artifact.
      - name: Publish to the latest release
        if: always() && steps.assemble.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app/build/outputs/apk/debug/*.apk aloud.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aloud.apk \
            --title "Latest build" \
            --notes "Debug build of ${{ github.sha }}. Tap aloud.apk below to install." \
            --prerelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore

      # Mirrors the failure output onto a branch of its own. Reading it over git needs no API
      # access, so a build can be diagnosed from an environment that only has git.
      - name: Mirror the build log to a branch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          cd "$work"
          git init -q
          # The tail is where the compiler errors are; a full Gradle log is mostly noise.
          tail -c 300000 /tmp/build.log > build.log
          cp -r "$GITHUB_WORKSPACE"/app/build/reports/tests . 2>/dev/null || true
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "build log for $GITHUB_SHA"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            HEAD:build-logs
