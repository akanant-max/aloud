name: Aloud
options:
  bundleIdPrefix: com.akhouri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aloud:
    type: application
    platform: iOS
    sources:
      - path: Aloud
        excludes:
          - Info.plist
    dependencies:
      - package: ZIPFoundation
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhouri.aloud
        PRODUCT_NAME: Aloud
        INFOPLIST_FILE: Aloud/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_OPTIMIZATION_LEVEL: "-O"
